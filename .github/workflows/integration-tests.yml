name: Integration Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - ".github/workflows/integration-tests.yml"
      - "!**/*.md"
      - "!**/docs/**"
  pull_request:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - ".github/workflows/integration-tests.yml"
      - "!**/*.md"
      - "!**/docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration-tests:
    name: Integration Tests (Playwright - MSW Mocked API)
    # NOTE: These tests use MSW (Mock Service Worker) to mock API responses
    # MSW intercepts network requests at the Node.js level, enabling SSR mocking
    # This allows testing error handling and resilience without a real Strapi backend
    # Integration tests focus on: error handling, retries, graceful degradation, SSR rendering
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"

      - name: Cache turbo build setup
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('**/package.json', '**/yarn.lock', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Build workspace packages
        run: |
          echo "🔨 Building @repo/shared-data package..."
          yarn workspace @repo/shared-data build
          echo "✅ Workspace packages built"

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Prepare Environment Variables
        run: |
          # Build UI .env.local (no Strapi needed - MSW handles all API mocking)
          cat > apps/ui/.env.local << 'EOF'
          NEXTAUTH_URL=http://localhost:3000
          NEXTAUTH_SECRET=password_secret
          STRAPI_URL=http://127.0.0.1:1337
          STRAPI_REST_READONLY_API_KEY=dummy_key_for_integration_tests
          E2E_TESTS_PLAYWRIGHT_API_KEY=dummy_key_for_integration_tests
          APP_PUBLIC_URL=http://127.0.0.1:3000
          EOF

      - name: Run Integration Tests
        run: |
          echo "🧪 Running integration tests with MSW (Playwright will manage server)..."
          echo "📋 Running chromium integration tests (error handling & resilience)"
          echo "ℹ️  Note: MSW mocks all API calls - no real Strapi required"
          yarn workspace @repo/ui playwright test tests/integration/ --project=chromium
        env:
          CI: true
          STRAPI_URL: http://127.0.0.1:1337
          APP_PUBLIC_URL: http://127.0.0.1:3000

      - name: Upload Server Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-server-logs-integration
          path: apps/ui/.next/server-logs/next-server.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-playwright-report
          path: apps/ui/playwright-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: apps/ui/test-results/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Playwright Traces
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-playwright-traces
          path: apps/ui/test-results/**/trace.zip
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-screenshots
          path: apps/ui/test-results/**/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Videos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-videos
          path: apps/ui/test-results/**/*.webm
          retention-days: 7
          if-no-files-found: ignore

      - name: Check Integration Test Results
        if: always()
        run: |
          if [ -f apps/ui/playwright-report/index.html ]; then
            echo "✅ Integration tests completed. View report in artifacts."
            echo "📊 Report available at: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "⚠️ No test report generated."
          fi
          
          # Check for test-results directory to verify tests ran
          if [ -d apps/ui/test-results ]; then
            echo "📁 Test results directory exists"
            ls -la apps/ui/test-results/ || true
          fi

      - name: Cleanup
        if: always()
        run: |
          echo "✅ Playwright handles server cleanup automatically"
