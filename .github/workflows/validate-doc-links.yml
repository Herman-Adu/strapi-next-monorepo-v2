name: Documentation Links Validation

on:
  workflow_dispatch:
  # DISABLED: Focusing on Lint and Build UI only
  # pull_request:
  #   paths:
  #     - "docs/**"
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - "docs/**"

jobs:
  validate-links:
    name: Validate Documentation Links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Run enhanced link validation
        id: validate
        continue-on-error: true
        run: |
          node scripts/validate-doc-links-enhanced.js > validation-output.txt 2>&1
          echo "exit_code=$?" >> $GITHUB_OUTPUT
        shell: bash

      - name: Display validation results
        if: always()
        run: cat validation-output.txt

      - name: Comment on PR (if broken links found)
        if: github.event_name == 'pull_request' && steps.validate.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('validation-output.txt', 'utf8');

            const body = `## 📚 Documentation Links Validation Results

            ⚠️ **Some documentation links need attention**

            <details>
            <summary>Click to see full validation report</summary>

            \`\`\`
            ${output}
            \`\`\`

            </details>

            ### 🔧 How to fix:

            1. Review the broken links above
            2. Run \`node scripts/validate-doc-links-enhanced.js\` locally
            3. Fix manually or run \`node scripts/migrate-all-links.js --apply\` for automatic fixes
            4. Commit and push your changes

            > ℹ️ This check is currently in **warning mode** and won't block your PR.
            `;

            // Find existing bot comment
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.data.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Documentation Links Validation Results')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Set status (warning mode)
        if: always()
        run: |
          if [ "${{ steps.validate.outputs.exit_code }}" != "0" ]; then
            echo "::warning::Documentation links validation found issues. See PR comment for details."
          else
            echo "::notice::All documentation links are valid! ✅"
          fi
          exit 0
