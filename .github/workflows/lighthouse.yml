name: Performance Budget (Lighthouse CI)

on:
  workflow_dispatch:
  # DISABLED: Focusing on Lint and Build UI only
  # pull_request:
  #   branches: [main]
  #   paths:
  #     - "apps/ui/src/**"
  #     - "apps/ui/public/**"
  #     - "packages/**"

jobs:
  lighthouse:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Prepare Environment Variables
        run: |
          cp apps/ui/.env.local.example apps/ui/.env.local
          echo "STRAPI_REST_READONLY_API_KEY=dummy_key_for_lighthouse" >> apps/ui/.env.local

      - name: Build Next.js app
        run: yarn workspace @repo/ui build
        env:
          NODE_ENV: production

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.13.x

      - name: Run Lighthouse CI
        run: lhci autorun
        # Using temporary-public-storage (no token required)
        # Reports are uploaded to Google's free temporary storage

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: lighthouse-results
          path: .lighthouseci/
          retention-days: 7

      - name: Comment PR with performance summary
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const manifestPath = '.lighthouseci/manifest.json';

            if (fs.existsSync(manifestPath)) {
              const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
              const url = manifest[0]?.url || 'Results uploaded';
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `⚡ **Lighthouse Performance Results**\n\n[View detailed report →](${url})\n\n*Performance budgets enforced automatically*`
              });
            }
