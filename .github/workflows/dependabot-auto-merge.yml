name: Dependabot Auto-Merge

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    # Only run for Dependabot PRs
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      
      - name: Wait for CI checks
        uses: lewagon/wait-on-check-action@v1.3.4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
          running-workflow-name: 'dependabot'
          allowed-conclusions: success
          # Wait for these workflows to complete
          check-regexp: (Lint|Build all apps|E2E Tests \(Playwright - MSW Mocked API\)|Integration Tests \(Playwright - MSW Mocked API\)|Chromatic Visual Tests)
      
      - name: Auto-merge patch & minor updates
        # Auto-merge if:
        # - Patch updates (1.2.3 -> 1.2.4)
        # - Minor updates (1.2.3 -> 1.3.0)
        # Skip major updates for manual review
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Comment on major updates
        # For major updates, add comment explaining manual review needed
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body "⚠️ **Major version update detected**
          
          This PR updates **${{ steps.metadata.outputs.dependency-names }}** from **${{ steps.metadata.outputs.previous-version }}** → **${{ steps.metadata.outputs.new-version }}**
          
          **Action Required:**
          - Review CHANGELOG for breaking changes
          - Test locally: \`gh pr checkout ${{ github.event.pull_request.number }}\`
          - Verify all workflows pass
          - Manually approve & merge when ready
          
          All CI checks must pass before merging."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Label based on update type
        run: |
          if [ "${{ steps.metadata.outputs.update-type }}" == "version-update:semver-major" ]; then
            gh pr edit "$PR_URL" --add-label "major-update,requires-manual-review"
          elif [ "${{ steps.metadata.outputs.update-type }}" == "version-update:semver-minor" ]; then
            gh pr edit "$PR_URL" --add-label "minor-update,auto-mergeable"
          else
            gh pr edit "$PR_URL" --add-label "patch-update,auto-mergeable"
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
