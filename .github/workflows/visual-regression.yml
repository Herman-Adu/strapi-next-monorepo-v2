name: Visual Regression Testing

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/ui/src/**"
      - "apps/ui/.storybook/**"
      - "packages/design-system/**"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  chromatic:
    name: Chromatic Visual Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for Chromatic to compare commits

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Publish to Chromatic
        uses: chromaui/action@latest
        with:
          # Chromatic project token from repository secrets
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # Build Storybook for visual testing
          buildScriptName: "build-storybook"
          # Don't wait for results (faster CI, review in Chromatic UI)
          exitZeroOnChanges: true
          # Only run on UI workspace
          workingDir: apps/ui
          # Auto-accept changes on main branch
          autoAcceptChanges: ${{ github.ref == 'refs/heads/main' }}
          # Skip unchanged stories
          onlyChanged: true

      - name: Comment PR with Chromatic results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = process.env.CHROMATIC_URL || 'Visual tests running...';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🎨 **Chromatic Visual Regression Tests**\n\n${output}\n\n[View Storybook →](${output})`
            });
