name: Cleanup old caches

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      actions: write # Required to delete caches
    steps:
      - name: Cleanup old caches
        uses: actions/github-script@v7
        with:
          script: |
            const maxAgeInDays = 7; // Keep caches younger than 7 days
            const now = new Date();
            
            console.log(`Starting cache cleanup - keeping caches younger than ${maxAgeInDays} days`);
            
            // Get all caches
            const caches = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            
            let deletedCount = 0;
            let deletedSize = 0;
            
            for (const cache of caches.data.actions_caches) {
              const createdAt = new Date(cache.created_at);
              const ageInDays = (now - createdAt) / (1000 * 60 * 60 * 24);
              
              if (ageInDays > maxAgeInDays) {
                const sizeInMB = (cache.size_in_bytes / 1024 / 1024).toFixed(2);
                console.log(`Deleting cache: ${cache.key} (${sizeInMB} MB, ${ageInDays.toFixed(1)} days old)`);
                
                try {
                  await github.rest.actions.deleteActionsCacheById({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    cache_id: cache.id
                  });
                  deletedCount++;
                  deletedSize += cache.size_in_bytes;
                } catch (error) {
                  console.error(`Failed to delete cache ${cache.key}: ${error.message}`);
                }
              }
            }
            
            const deletedSizeInGB = (deletedSize / 1024 / 1024 / 1024).toFixed(2);
            console.log(`\n✅ Cleanup complete: Deleted ${deletedCount} caches (${deletedSizeInGB} GB total)`);
