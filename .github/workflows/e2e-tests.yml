name: E2E Tests

on:
  workflow_dispatch:
  # Only run on code changes (not docs)
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/e2e-tests.yml'
      - '!**/*.md'
      - '!**/docs/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/e2e-tests.yml'
      - '!**/*.md'
      - '!**/docs/**'
  # Run weekly instead of daily (save resources)
  schedule:
    - cron: '0 2 * * 0'  # Sunday at 2 AM UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-tests:
    name: E2E Tests (Playwright)
    timeout-minutes: 15  # Reduced from 30 - optimized workflow
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: strapi
          POSTGRES_PASSWORD: strapi
          POSTGRES_DB: strapi_dev
        options: >-
          --health-cmd "pg_isready -U strapi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
        ports:
          - 5432:5432

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Cache turbo build setup
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('**/package.json', '**/yarn.lock', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium  # Only Chromium for faster CI

      - name: Prepare Environment Variables
        run: |
          # Build Strapi .env from scratch (no .env.example copy to avoid empty placeholders)
          cat > apps/strapi/.env << 'EOF'
          HOST=0.0.0.0
          PORT=1337
          APP_KEYS=l8ftzyp2hNmEtNXBYU5hhQ==,lH7EcVVZxIoTFRorjrV9Vw==,jxWii7EjavRgJ4jYPZ60hA==,FlZM4tyij/HDFcKZhsmlXQ==
          API_TOKEN_SALT=usReW/cYjLHmpLEoRnWf+g==
          ADMIN_JWT_SECRET=Xw39b/xXxEHW1x1WMM6ugQ==
          JWT_SECRET=ShuOcfjTi/RwcchWEIKYKA==
          DATABASE_CLIENT=postgres
          DATABASE_HOST=localhost
          DATABASE_PORT=5432
          DATABASE_NAME=strapi_dev
          DATABASE_USERNAME=strapi
          DATABASE_PASSWORD=${{ secrets.E2E_DB_PASSWORD }}
          DATABASE_SSL=false
          STRAPI_PREVIEW_ENABLED=false
          WEBHOOKS_POPULATE_RELATIONS=false
          EOF
          
          # Build UI .env.local from scratch (all required variables present)
          cat > apps/ui/.env.local << 'EOF'
          NEXT_OUTPUT=
          NEXTAUTH_URL=http://localhost:3000
          NEXTAUTH_SECRET=password_secret
          STRAPI_URL=http://127.0.0.1:1337
          STRAPI_REST_READONLY_API_KEY=${{ secrets.E2E_API_TOKEN }}
          E2E_TESTS_PLAYWRIGHT_API_KEY=${{ secrets.E2E_API_TOKEN }}
          APP_PUBLIC_URL=http://127.0.0.1:3000
          EOF

      - name: Build Strapi
        run: yarn build:strapi

      - name: Build UI
        run: yarn build:ui
        env:
          E2E_TESTS_PLAYWRIGHT_API_KEY: ${{ secrets.E2E_API_TOKEN }}
          STRAPI_URL: http://127.0.0.1:1337
          APP_PUBLIC_URL: http://127.0.0.1:3000

      # ==============================================================================
      # VALIDATE POSTGRES CONNECTION
      # ==============================================================================

      - name: Wait for Postgres (validate strapi user and database)
        run: |
          export PGPASSWORD=strapi
          attempts=0
          until psql -h localhost -U strapi -d strapi_dev -c '\q' >/dev/null 2>&1; do
            attempts=$((attempts+1))
            if [ $attempts -gt 30 ]; then
              echo "❌ Postgres did not become available for user 'strapi' and database 'strapi_dev' after $attempts attempts"
              exit 1
            fi
            echo "⏳ Waiting for Postgres to accept connections as 'strapi' to database 'strapi_dev' (attempt $attempts/30)..."
            sleep 2
          done
          echo "✅ Postgres is accepting connections as 'strapi' to database 'strapi_dev'"

      # ==============================================================================
      # SEED E2E TEST DATA
      # ==============================================================================

      - name: Seed E2E Test Data
        run: |
          cd apps/strapi
          chmod +x scripts/seed-e2e-data.sh
          ./scripts/seed-e2e-data.sh
        env:
          DATABASE_URL: postgresql://strapi:${{ secrets.E2E_DB_PASSWORD }}@localhost:5432/strapi_dev
          E2E_API_TOKEN: ${{ secrets.E2E_API_TOKEN }}

      # ==============================================================================
      # VALIDATE TOKEN CREATION
      # ==============================================================================

      - name: Validate E2E Token Creation
        run: |
          echo "🔍 Verifying E2E API token was created in database..."
          export PGPASSWORD="${{ secrets.E2E_DB_PASSWORD }}"
          TOKEN_COUNT=$(psql -h localhost -U strapi -d strapi_dev -t -c "SELECT COUNT(*) FROM api_tokens WHERE name='e2e-readonly-token';")
          TOKEN_COUNT=$(echo $TOKEN_COUNT | tr -d '[:space:]')
          
          if [ "$TOKEN_COUNT" == "1" ]; then
            echo "✅ E2E token exists in database"
          else
            echo "❌ E2E token not found in database (count: $TOKEN_COUNT)"
            exit 1
          fi

      # ==============================================================================
      # START SERVERS AND RUN E2E TESTS
      # ==============================================================================

      - name: Start Servers and Run E2E Tests
        run: |
          # Start Strapi in background (bypass Turbo, call directly in app directory)
          echo "🚀 Starting Strapi..."
          cd apps/strapi
          NODE_ENV=production DATABASE_HOST=localhost DATABASE_PORT=5432 DATABASE_NAME=strapi_dev DATABASE_USERNAME=strapi DATABASE_PASSWORD="${{ secrets.E2E_DB_PASSWORD }}" DATABASE_CLIENT=postgres DATABASE_SSL=false yarn start &
          STRAPI_PID=$!
          echo "STRAPI_PID=$STRAPI_PID" >> $GITHUB_ENV
          cd ../..
          
          # Wait for Strapi health check
          echo "⏳ Waiting for Strapi to be ready..."
          timeout=60
          elapsed=0
          until curl -s http://127.0.0.1:1337/_health > /dev/null 2>&1; do
            if [ $elapsed -ge $timeout ]; then
              echo "❌ Strapi failed to start within $timeout seconds"
              kill $STRAPI_PID 2>/dev/null || true
              exit 1
            fi
            sleep 5
            elapsed=$((elapsed + 5))
            echo "  ⏱️  Waiting... ($elapsed/$timeout seconds)"
          done
          echo "✅ Strapi is ready at http://127.0.0.1:1337!"
          
          # ==============================================================================
          # TEST API TOKEN AUTHENTICATION
          # ==============================================================================
          
          echo "🔐 Testing API token authentication..."
          API_RESPONSE=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer ${{ secrets.E2E_API_TOKEN }}" http://127.0.0.1:1337/api/pages)
          HTTP_CODE=$(echo "$API_RESPONSE" | tail -n1)
          RESPONSE_BODY=$(echo "$API_RESPONSE" | sed '$d')
          
          echo "HTTP Status: $HTTP_CODE"
          
          if [ "$HTTP_CODE" == "200" ]; then
            echo "✅ API token authentication successful!"
            echo "📄 Response preview:"
            echo "$RESPONSE_BODY" | head -c 200
            echo "..."
          else
            echo "❌ API token authentication FAILED!"
            echo "📄 Full response:"
            echo "$RESPONSE_BODY"
            echo ""
            echo "🔍 Debugging info: Token authentication failed with HTTP $HTTP_CODE"
            kill $STRAPI_PID $NEXTJS_PID 2>/dev/null || true
            exit 1
          fi
          
          # Start Next.js in background (bypass Turbo, call directly in app directory)
          echo "🚀 Starting Next.js..."
          cd apps/ui
          yarn start &
          NEXTJS_PID=$!
          echo "NEXTJS_PID=$NEXTJS_PID" >> $GITHUB_ENV
          cd ../..
          
          # Wait for Next.js health check
          echo "⏳ Waiting for Next.js to be ready..."
          timeout=60
          elapsed=0
          until curl -s http://127.0.0.1:3000 > /dev/null 2>&1; do
            if [ $elapsed -ge $timeout ]; then
              echo "❌ Next.js failed to start within $timeout seconds"
              kill $STRAPI_PID $NEXTJS_PID 2>/dev/null || true
              exit 1
            fi
            sleep 5
            elapsed=$((elapsed + 5))
            echo "  ⏱️  Waiting... ($elapsed/$timeout seconds)"
          done
          echo "✅ Next.js is ready at http://127.0.0.1:3000!"
          
          # Verify both servers are still responding before running tests
          echo "🔍 Verifying servers are still responding..."
          
          # Give servers a moment to fully stabilize after startup
          sleep 3
          
          # Verify Strapi (with retries for stability)
          attempts=0
          until curl -f http://127.0.0.1:1337/_health > /dev/null 2>&1; do
            attempts=$((attempts+1))
            if [ $attempts -gt 5 ]; then
              echo "⚠️ Strapi health check failed after $attempts attempts!"
              kill $STRAPI_PID $NEXTJS_PID 2>/dev/null || true
              exit 1
            fi
            echo "  🔄 Strapi verification attempt $attempts/5..."
            sleep 2
          done
          
          # Verify Next.js (with retries for stability)
          attempts=0
          until curl -f http://127.0.0.1:3000 > /dev/null 2>&1; do
            attempts=$((attempts+1))
            if [ $attempts -gt 5 ]; then
              echo "⚠️ Next.js health check failed after $attempts attempts!"
              kill $STRAPI_PID $NEXTJS_PID 2>/dev/null || true
              exit 1
            fi
            echo "  🔄 Next.js verification attempt $attempts/5..."
            sleep 2
          done
          
          echo "✅ Both servers verified and stable!"
          
          # Run E2E tests (servers still running in background)
          # Run Playwright directly to avoid Turbo rebuilding dependencies
          echo "🧪 Running E2E tests..."
          cd apps/ui
          npx playwright test
          TEST_EXIT_CODE=$?
          cd ../..
          
          # Cleanup servers
          echo "🧹 Stopping servers..."
          kill $STRAPI_PID $NEXTJS_PID 2>/dev/null || true
          
          # Exit with test exit code
          exit $TEST_EXIT_CODE
        env:
          CI: true
          DATABASE_URL: postgresql://strapi:${{ secrets.E2E_DB_PASSWORD }}@localhost:5432/strapi_dev
          # Use the E2E token created by seed script (injected via GitHub Secrets)
          E2E_TESTS_PLAYWRIGHT_API_KEY: ${{ secrets.E2E_API_TOKEN }}
          STRAPI_URL: http://127.0.0.1:1337
          APP_PUBLIC_URL: http://127.0.0.1:3000

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/ui/playwright-report/
          retention-days: 30

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: apps/ui/test-results/
          retention-days: 7

      - name: Upload Playwright Traces
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-traces
          path: apps/ui/test-results/**/trace.zip
          retention-days: 30

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: apps/ui/test-results/**/*.png
          retention-days: 7

      - name: Upload Videos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: videos
          path: apps/ui/test-results/**/*.webm
          retention-days: 7

      - name: Comment PR with Test Results
        uses: daun/playwright-report-comment@v3
        if: always() && github.event_name == 'pull_request'
        with:
          report-file: apps/ui/playwright-report/index.html
          
      - name: Check E2E Test Results
        if: always()
        run: |
          if [ -f apps/ui/playwright-report/index.html ]; then
            echo "✅ E2E tests completed. View report in artifacts."
          else
            echo "⚠️ No test report generated."
          fi

      - name: Cleanup Servers
        if: always()
        run: |
          echo "🧹 Stopping servers..."
          if [ ! -z "$STRAPI_PID" ]; then
            kill $STRAPI_PID 2>/dev/null || true
          fi
          if [ ! -z "$NEXTJS_PID" ]; then
            kill $NEXTJS_PID 2>/dev/null || true
          fi
          echo "✅ Cleanup complete"
