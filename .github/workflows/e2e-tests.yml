name: E2E Tests

on:
  workflow_dispatch:
  # Only run on code changes (not docs)
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/e2e-tests.yml'
      - '!**/*.md'
      - '!**/docs/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/e2e-tests.yml'
      - '!**/*.md'
      - '!**/docs/**'
  # Run weekly instead of daily (save resources)
  schedule:
    - cron: '0 2 * * 0'  # Sunday at 2 AM UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  STRAPI_REST_READONLY_API_KEY: random-value-just-for-build

jobs:
  e2e-tests:
    name: E2E Tests (Playwright)
    timeout-minutes: 15  # Reduced from 30 - optimized workflow
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: strapi
          POSTGRES_PASSWORD: strapi
          POSTGRES_DB: strapi_dev
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Cache turbo build setup
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('**/package.json', '**/yarn.lock', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium  # Only Chromium for faster CI

      - name: Prepare Environment Variables
        run: |
          cp apps/strapi/.env.example apps/strapi/.env
          cp apps/ui/.env.local.example apps/ui/.env.local
          echo "STRAPI_REST_READONLY_API_KEY=${{ env.STRAPI_REST_READONLY_API_KEY }}" >> apps/ui/.env.local
          
          # Database configuration for CI
          echo "DATABASE_CLIENT=postgres" >> apps/strapi/.env
          echo "DATABASE_HOST=localhost" >> apps/strapi/.env
          echo "DATABASE_PORT=5432" >> apps/strapi/.env
          echo "DATABASE_NAME=strapi_dev" >> apps/strapi/.env
          echo "DATABASE_USERNAME=strapi" >> apps/strapi/.env
          echo "DATABASE_PASSWORD=strapi" >> apps/strapi/.env
          echo "DATABASE_SSL=false" >> apps/strapi/.env

      - name: Build Strapi
        run: yarn build:strapi

      - name: Build UI
        run: yarn build:ui

      - name: Seed E2E Test Data
        run: |
          cd apps/strapi
          chmod +x scripts/seed-e2e-data.sh
          ./scripts/seed-e2e-data.sh
        env:
          DATABASE_URL: postgresql://strapi:strapi@localhost:5432/strapi_dev

      - name: Start Servers and Run E2E Tests
        run: |
          # Start Strapi in background
          echo "🚀 Starting Strapi..."
          NODE_ENV=production yarn start:strapi &
          STRAPI_PID=$!
          
          # Wait for Strapi health check
          echo "⏳ Waiting for Strapi to be ready..."
          timeout=60
          elapsed=0
          until curl -s http://localhost:1337/_health > /dev/null 2>&1; do
            if [ $elapsed -ge $timeout ]; then
              echo "❌ Strapi failed to start"
              kill $STRAPI_PID 2>/dev/null || true
              exit 1
            fi
            sleep 5
            elapsed=$((elapsed + 5))
          done
          echo "✅ Strapi is ready!"
          
          # Start Next.js in background
          echo "🚀 Starting Next.js..."
          yarn start:ui &
          NEXTJS_PID=$!
          
          # Wait for Next.js health check
          echo "⏳ Waiting for Next.js to be ready..."
          timeout=30
          elapsed=0
          until curl -s http://localhost:3000 > /dev/null 2>&1; do
            if [ $elapsed -ge $timeout ]; then
              echo "❌ Next.js failed to start"
              kill $STRAPI_PID $NEXTJS_PID 2>/dev/null || true
              exit 1
            fi
            sleep 3
            elapsed=$((elapsed + 3))
          done
          echo "✅ Next.js is ready!"
          
          # Run E2E tests (servers still running in background)
          echo "🧪 Running E2E tests..."
          yarn test:e2e
          TEST_EXIT_CODE=$?
          
          # Cleanup servers
          echo "🧹 Stopping servers..."
          kill $STRAPI_PID $NEXTJS_PID 2>/dev/null || true
          
          # Exit with test exit code
          exit $TEST_EXIT_CODE
        env:
          CI: true
          DATABASE_URL: postgresql://strapi:strapi@localhost:5432/strapi_dev

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/ui/playwright-report/
          retention-days: 30

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: apps/ui/test-results/
          retention-days: 7

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: apps/ui/test-results/**/*.png
          retention-days: 7

      - name: Upload Videos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: videos
          path: apps/ui/test-results/**/*.webm
          retention-days: 7

      - name: Comment PR with Test Results
        uses: daun/playwright-report-comment@v3
        if: always() && github.event_name == 'pull_request'
        with:
          report-file: apps/ui/playwright-report/index.html
          
      - name: Check E2E Test Results
        if: always()
        run: |
          if [ -f apps/ui/playwright-report/index.html ]; then
            echo "✅ E2E tests completed. View report in artifacts."
          else
            echo "⚠️ No test report generated."
          fi

      - name: Cleanup Servers
        if: always()
        run: |
          echo "🧹 Stopping servers..."
          kill ${{ env.STRAPI_PID }} 2>/dev/null || true
          kill ${{ env.NEXTJS_PID }} 2>/dev/null || true
          echo "✅ Cleanup complete"
