name: E2E Tests

on:
  workflow_dispatch:
  # Only run on code changes (not docs)
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/e2e-tests.yml'
      - '!**/*.md'
      - '!**/docs/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/e2e-tests.yml'
      - '!**/*.md'
      - '!**/docs/**'
  # Run weekly instead of daily (save resources)
  schedule:
    - cron: '0 2 * * 0'  # Sunday at 2 AM UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-tests:
    name: E2E Tests (Playwright - Mocked API)
    # NOTE: These tests use mocked API responses (see apps/ui/e2e/fixtures/mock-api.ts)
    # No Strapi or database required - tests UI behavior only
    # For API integration tests with real Strapi, see integration-tests.yml
    timeout-minutes: 10  # Fast - no Strapi startup needed
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'

      - name: Cache turbo build setup
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('**/package.json', '**/yarn.lock', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium  # Only Chromium for faster CI

      - name: Prepare Environment Variables
        run: |
          # Build Strapi .env from scratch (no .env.example copy to avoid empty placeholders)
          cat > apps/strapi/.env << 'EOF'
          HOST=0.0.0.0
          PORT=1337
          APP_KEYS=l8ftzyp2hNmEtNXBYU5hhQ==,lH7EcVVZxIoTFRorjrV9Vw==,jxWii7EjavRgJ4jYPZ60hA==,FlZM4tyij/HDFcKZhsmlXQ==
          API_TOKEN_SALT=usReW/cYjLHmpLEoRnWf+g==
          ADMIN_JWT_SECRET=Xw39b/xXxEHW1x1WMM6ugQ==
          JWT_SECRET=ShuOcfjTi/RwcchWEIKYKA==
          ENCRYPTION_KEY=${{ secrets.ENCRYPTION_KEY }}
          DATABASE_CLIENT=postgres
          DATABASE_HOST=localhost
          DATABASE_PORT=5432
          DATABASE_NAME=strapi_dev
          DATABASE_USERNAME=strapi
          DATABASE_PASSWORD=${{ secrets.E2E_DB_PASSWORD }}
          DATABASE_SSL=false
          STRAPI_PREVIEW_ENABLED=false
          WEBHOOKS_POPULATE_RELATIONS=false
          EOF
          
          # Build UI .env.local from scratch (CI uses default Next.js output mode)
          cat > apps/ui/.env.local << 'EOF'
          NEXTAUTH_URL=http://localhost:3000
          NEXTAUTH_SECRET=password_secret
          STRAPI_URL=http://127.0.0.1:1337
          STRAPI_REST_READONLY_API_KEY=${{ secrets.E2E_API_TOKEN }}
          E2E_TESTS_PLAYWRIGHT_API_KEY=${{ secrets.E2E_API_TOKEN }}
          APP_PUBLIC_URL=http://127.0.0.1:3000
          EOF

      - name: Build UI
        run: yarn build:ui

      - name: Run E2E Tests
        run: |
          echo "🧪 Running E2E tests with mocked API..."
          cd apps/ui
          npx playwright test
          TEST_EXIT_CODE=$?
          cd ../..
          
          # Exit with test exit code
          exit $TEST_EXIT_CODE
        env:
          CI: true
          DATABASE_URL: postgresql://strapi:${{ secrets.E2E_DB_PASSWORD }}@localhost:5432/strapi_dev
          # Use the E2E token created by seed script (injected via GitHub Secrets)
          E2E_TESTS_PLAYWRIGHT_API_KEY: ${{ secrets.E2E_API_TOKEN }}
          STRAPI_URL: http://127.0.0.1:1337
          APP_PUBLIC_URL: http://127.0.0.1:3000

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/ui/playwright-report/
          retention-days: 30

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: apps/ui/test-results/
          retention-days: 7

      - name: Upload Playwright Traces
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-traces
          path: apps/ui/test-results/**/trace.zip
          retention-days: 30

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: apps/ui/test-results/**/*.png
          retention-days: 7

      - name: Upload Videos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: videos
          path: apps/ui/test-results/**/*.webm
          retention-days: 7

      - name: Comment PR with Test Results
        uses: daun/playwright-report-comment@v3
        if: always() && github.event_name == 'pull_request'
        with:
          report-file: apps/ui/playwright-report/index.html
          
      - name: Check E2E Test Results
        if: always()
        run: |
          if [ -f apps/ui/playwright-report/index.html ]; then
            echo "✅ E2E tests completed. View report in artifacts."
          else
            echo "⚠️ No test report generated."
          fi

      - name: Cleanup Servers
        if: always()
        run: |
          echo "🧹 Stopping servers..."
          if [ ! -z "$STRAPI_PID" ]; then
            kill $STRAPI_PID 2>/dev/null || true
          fi
          if [ ! -z "$NEXTJS_PID" ]; then
            kill $NEXTJS_PID 2>/dev/null || true
          fi
          echo "✅ Cleanup complete"
