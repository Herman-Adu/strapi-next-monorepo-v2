name: E2E Tests

on:
  workflow_dispatch:
  # DISABLED: Focusing on Lint and Build UI only
  # # Only run on code changes (not docs)
  # push:
  #   branches: [main]
  #   paths:
  #     - "apps/**"
  #     - "packages/**"
  #     - ".github/workflows/e2e-tests.yml"
  #     - "!**/*.md"
  #     - "!**/docs/**"
  # pull_request:
  #   branches: [main]
  #   paths:
  #     - "apps/**"
  #     - "packages/**"
  #     - ".github/workflows/e2e-tests.yml"
  #     - "!**/*.md"
  #     - "!**/docs/**"
  # # Run weekly instead of daily (save resources)
  # schedule:
  #   - cron: "0 2 * * 0" # Sunday at 2 AM UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-tests:
    name: E2E Tests (Playwright - MSW Mocked API)
    # NOTE: These tests use MSW (Mock Service Worker) to mock API responses
    # MSW intercepts network requests at the Node.js level, enabling SSR mocking
    # This allows testing without a real Strapi backend - UI behavior only
    # For API integration tests with real Strapi, see integration-tests.yml
    timeout-minutes: 15 # Dev server + tests need more time
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "yarn"

      - name: Cache turbo build setup
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('**/package.json', '**/yarn.lock', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Build workspace packages
        run: |
          echo "🔨 Building @repo/shared-data package..."
          yarn workspace @repo/shared-data build
          echo "✅ Workspace packages built"

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium # Only Chromium for faster CI

      - name: Prepare Environment Variables
        run: |
          # Build UI .env.local (no Strapi needed - MSW handles all API mocking)
          cat > apps/ui/.env.local << 'EOF'
          NEXTAUTH_URL=http://localhost:3000
          NEXTAUTH_SECRET=password_secret
          STRAPI_URL=http://127.0.0.1:1337
          STRAPI_REST_READONLY_API_KEY=dummy_key_for_e2e_tests
          E2E_TESTS_PLAYWRIGHT_API_KEY=dummy_key_for_e2e_tests
          APP_PUBLIC_URL=http://127.0.0.1:3000
          EOF

      - name: Run E2E Tests
        run: |
          echo "🧪 Running E2E tests with MSW (Playwright will manage server)..."
          echo "📋 Running 144 passing tests (21 tests skipped - form submissions need MSW POST fix)"
          cd apps/ui
          npx playwright test --project=chromium
        env:
          CI: true
          STRAPI_URL: http://127.0.0.1:1337
          APP_PUBLIC_URL: http://127.0.0.1:3000

      - name: Upload Server Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-server-logs
          path: apps/ui/.next/server-logs/next-server.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/ui/playwright-report/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: apps/ui/test-results/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Playwright Traces
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-traces
          path: apps/ui/test-results/**/trace.zip
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: apps/ui/test-results/**/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Videos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: videos
          path: apps/ui/test-results/**/*.webm
          retention-days: 7
          if-no-files-found: ignore

      - name: Comment PR with Test Results
        uses: daun/playwright-report-comment@v3
        if: always() && github.event_name == 'pull_request'
        with:
          report-file: apps/ui/playwright-report/index.html

      - name: Check E2E Test Results
        if: always()
        run: |
          if [ -f apps/ui/playwright-report/index.html ]; then
            echo "✅ E2E tests completed. View report in artifacts."
          else
            echo "⚠️ No test report generated."
          fi

      - name: Cleanup
        if: always()
        run: |
          echo "✅ Playwright handles server cleanup automatically"
